name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The crate links against MinGW and deny.toml only allows the GNU target, so
  # build on the same toolchain locally and in CI instead of rustup's MSVC
  # default for this runner.
  RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu

jobs:
  check:
    name: fmt, clippy, test, deny
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The windows-* crates need dlltool at build time; rustup's bundled copy
      # fails on some installs, which is why the README points at WinLibs too.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Put MinGW-w64 on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\msys64\ucrt64\bin'

      - name: Install toolchain
        shell: pwsh
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        shell: pwsh
        run: cargo fmt --all --check

      - name: cargo clippy
        shell: pwsh
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        shell: pwsh
        run: cargo test --locked

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny
        shell: pwsh
        run: cargo deny check

  package:
    name: release archive
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Put MinGW-w64 on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\msys64\ucrt64\bin'

      - name: Install toolchain
        shell: pwsh
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - uses: Swatinem/rust-cache@v2

      # Packaging is what a release does, so exercise it on every change rather
      # than discovering a broken script at tag time.
      - name: Build archive
        shell: pwsh
        run: ./scripts/release.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: remaprs-windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 7
