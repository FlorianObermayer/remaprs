# cargo-deny: dependency policy for remaprs.
#
# Run with `cargo deny check`. The script `scripts/check.ps1` does it for you.

[graph]
# Only the platform this crate actually ships on.
targets = [{ triple = "x86_64-pc-windows-gnu" }]

[advisories]
# Fail on security advisories and on yanked crates.
version = 2
yanked = "deny"
# Unmaintained crates are common and usually harmless for a local tool; report
# them without failing the build.
unmaintained = "workspace"

[licenses]
# Licenses this project is willing to ship.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9
# The allow list documents which licenses this project accepts, so it is kept
# broader than the current dependency tree; do not warn about unused entries.
unused-allowed-license = "allow"

[bans]
# Duplicate versions usually come from proc-macro crates and cannot be resolved
# from a single manifest, so report rather than fail.
multiple-versions = "warn"
wildcards = "deny"
deny = [{ name = "openssl-sys", reason = "prefer rustls or platform TLS; this project needs neither" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
